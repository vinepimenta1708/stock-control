<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Control | Mini ERP</title>
  <meta name="description" content="A lightweight inventory module inspired by ERP systems: products, stock movements, low-stock alerts and history, built with vanilla JavaScript." />
  <meta name="theme-color" content="#0f3d22" />
  <meta property="og:title" content="Stock Control — Mini ERP" />
  <meta property="og:description" content="Inventory module inspired by ERP systems, built with HTML, CSS and vanilla JavaScript." />
  <meta property="og:image" content="https://vinepimenta1708.github.io/stock-control/docs/screenshot-light.png" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>" />
  <link rel="stylesheet" href="style.css?v=2" />
  <script>
    // Apply the saved theme before the page paints (avoids a flash of the wrong theme)
    try {
      const saved = localStorage.getItem("stock-control-theme");
      const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) { /* ignore */ }
  </script>
</head>
<body>
  <header class="topbar">
    <h1>📦 Stock Control</h1>
    <span class="subtitle">A mini ERP inventory module</span>
    <div class="topbar-actions">
      <button id="theme-toggle" class="ghost" aria-label="Toggle dark mode"></button>
      <button id="reset" class="ghost" title="Restore the sample data">Reset demo data</button>
    </div>
  </header>

  <main class="container">
    <section class="cards">
      <div class="card"><span>Products</span><strong id="kpi-products">0</strong></div>
      <div class="card"><span>Items in stock</span><strong id="kpi-items">0</strong></div>
      <div class="card"><span>Stock value</span><strong id="kpi-value">$0.00</strong></div>
      <div class="card alert"><span>Low stock</span><strong id="kpi-low">0</strong></div>
    </section>

    <section class="grid">
      <form id="product-form" class="panel">
        <h2 id="form-title">New product</h2>
        <label>SKU <input id="sku" required placeholder="e.g. PRD-001" /></label>
        <label>Name <input id="name" required placeholder="Product name" /></label>
        <label>Unit price <input id="price" type="number" min="0" step="0.01" required /></label>
        <label>Minimum stock <input id="min" type="number" min="0" value="5" required /></label>
        <div class="form-actions">
          <button type="submit" id="form-submit">Add product</button>
          <button type="button" id="form-cancel" class="secondary" hidden>Cancel</button>
        </div>
      </form>

      <form id="move-form" class="panel">
        <h2>Stock movement</h2>
        <label>Product <select id="move-product" required></select></label>
        <label>Type
          <select id="move-type">
            <option value="in">Entry (+)</option>
            <option value="out">Exit (−)</option>
          </select>
        </label>
        <label>Quantity <input id="move-qty" type="number" min="1" value="1" required /></label>
        <button type="submit">Register movement</button>
        <p id="move-msg" class="msg"></p>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Inventory</h2>
        <input id="search" placeholder="Search by SKU or name…" />
      </div>
      <table>
        <thead>
          <tr><th>SKU</th><th>Name</th><th>Price</th><th>Qty</th><th>Min</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="inventory"></tbody>
      </table>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Stock levels</h2>
        <span class="legend"><i class="dot ok"></i>Above minimum <i class="dot low"></i>At or below minimum</span>
      </div>
      <div id="chart" class="chart"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Movement history</h2>
        <div class="filters">
          <select id="history-product" aria-label="Filter by product"></select>
          <select id="history-type" aria-label="Filter by type">
            <option value="">All types</option>
            <option value="in">Entries</option>
            <option value="out">Exits</option>
          </select>
          <input id="history-from" type="date" aria-label="From date" title="From" />
          <input id="history-to" type="date" aria-label="To date" title="To" />
          <button id="export" class="secondary">Export CSV</button>
        </div>
      </div>
      <ul id="history" class="history"></ul>
    </section>
  </main>

  <footer class="footer">
    Built by <a href="https://github.com/vinepimenta1708">Vinícius Pimenta</a> ·
    <a href="https://github.com/vinepimenta1708/stock-control">Source on GitHub</a>
  </footer>

  <script src="app.js?v=2"></script>
</body>
</html>
